<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ranking DBZ BT3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-adsense-account" content="ca-pub-1831930018468380">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="css/estilos.css">
    <!--esta linea se encarga de llamar a los estilos que estan en la carpeta css-->

    <!-- Google tag (gtag.js) para estadisticas y anuncios-->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5C5SDM9QZG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-5C5SDM9QZG');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1831930018468380"
        crossorigin="anonymous"></script>
</head>

<body>

    <div id="user-identity-container">
        <div id="user-bar">
            <span>👤 Guerrero: <strong id="current-user-name"></strong></span>
            <div>
                <button onclick="cerrarSesion()">Salir</button>
            </div>
        </div>

        <div id="login-prompt">
            <p>Inicia sesión para registrar tus victorias y entrar a las salas:</p>
            <a href="login.html">
                <button>
                🔑 INGRESAR AL RANKING
                </button>
            </a>
        </div>
    </div>

    <h1>🔥 RANKING DBZ BT3 🔥</h1>
    
    <div>
        <input id="searchRanking" placeholder="🔍 Buscar jugador...">
    </div>

    <div class="online-offline-container">
        <div class="online-offline-box online-box">
            Jugadores en línea: <strong id="onlineCount">0</strong> 🟢
        </div>

        <div class="online-offline-box offline-box">
            Jugadores desconectados: <strong id="offlineCount">0</strong> ⚪
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>🌐</th>
                    <th>Guerrero</th>
                    <th>Rango</th>
                    <th>ELO</th>
                    <th>Progreso</th>
                    <th>W/L</th>
                    <th>Racha</th>
                </tr>
            </thead>
            <tbody id="ranking"></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modalTitle" style="text-align:center; margin-top:0;"></h3>
            <div id="modalStats" style="background: #2a2a2a; padding: 15px; border-radius: 10px; margin: 10px 0;"></div>
            <canvas id="eloChart" width="400" height="200"></canvas>
            <h4 style="margin: 15px 0 5px 0; font-size: 0.9rem; color: #FFD700;">Últimas Peleas:</h4>
            <ul id="modalHistory" style="list-style: none; padding: 0; margin-bottom: 20px;"></ul>
            <button onclick="closeModal()"
                style="width:100%; padding:12px; cursor:pointer; background: #444; color: white; border: none; border-radius: 8px; font-weight: bold;">Cerrar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_eT9VlLk_b1toTcva8w9NwU-FGjrEtEI",
            authDomain: "ranking-dbz-bt3.firebaseapp.com",
            databaseURL: "https://ranking-dbz-bt3-default-rtdb.firebaseio.com",
            projectId: "ranking-dbz-bt3",
            storageBucket: "ranking-dbz-bt3.firebasestorage.app",
            messagingSenderId: "228731370543",
            appId: "1:228731370543:web:ff3e418be283b6387edada"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let alreadyMarkedOnline = {}; // objeto para marcar por usuario (evita repetir)

        let players = [], history = [];
        const PAGE_SIZE = 10;
        let currentPage = 1;
        let chartInstance = null;

        const ranks = [
            { name: "E", min: 0, max: 99, class: "rank-E" },
            { name: "D", min: 100, max: 299, class: "rank-D" },
            { name: "C", min: 300, max: 499, class: "rank-C" },
            { name: "B", min: 500, max: 699, class: "rank-B" },
            { name: "A", min: 700, max: 999, class: "rank-A" },
            { name: "S", min: 1000, max: Infinity, class: "rank-S" }
        ];

        function getBanderaHTML(country) {
            if (!country) return "🏳️";
            const banderas = {
                "ARGENTINA": "bandera argentina.png",
                "PERÚ": "bandera peru.png",
                "PARAGUAY": "bandera paraguay.png",
                "CHILE": "bandera chile.png",
                "URUGUAY": "bandera uruguay.png",
                "BRASIL": "bandera brasil.png",
                "VENEZUELA": "bandera venezuela.png",     // clave exacta
                "ECUADOR": "bandera ecuador.png"   // ← AGREGAR ESTA LÍNEA
            };

            const file = banderas[country.toUpperCase()];
            return file ? `<img src="Imagenes/${file}" class="player-flag">` : "🏳️";
        }

        function getRank(e) { return ranks.find(r => e >= r.min && e <= r.max) || ranks[0]; }
        function getProgress(e, r) { return r.name === "S" ? 100 : Math.max(5, Math.min(100, ((e - r.min) / (r.max - r.min)) * 100)); }

        db.ref('/').on('value', snapshot => {
            const data = snapshot.val();
            players = data?.players || [];
            history = data?.history || [];
            // Ordenar history descendente por id (nuevos primero) - FIX: parseInt para ids strings
            history.sort((a, b) => {
                const timeA = a.timestamp || parseInt(a.id) || 0;
                const timeB = b.timestamp || parseInt(b.id) || 0;
                return timeB - timeA; // descendente: nuevos primero
            });
            render();
            verificarSesion();

            // Listener para status online/offline + contadores (Paso 6)
            db.ref('status').on('value', snapshotStatus => {
                const statusData = snapshotStatus.val() || {};

                // Actualiza puntos en la tabla
                document.querySelectorAll('[id^="status-"]').forEach(span => {
                    const rawId = span.id.replace('status-', '');
                    const playerName = rawId.replace(/_/g, '-');

                    const userStatus = statusData[playerName];
                    span.className = ''; // limpia clases previas
                    span.innerHTML = ''; // limpia contenido anterior

                    if (userStatus && userStatus.online === true) {
                        span.classList.add('status-online');
                    } else {
                        span.innerHTML = '⚪';
                        span.style.color = '#9E9E9E';
                        span.style.fontSize = '1.1em';
                    }
                });

                // Contador de jugadores online
                const onlinePlayers = Object.values(statusData).filter(s => s.online === true).length;
                document.getElementById('onlineCount').innerText = onlinePlayers;

                // Contador desconectados: TODOS los jugadores de /players - online
                db.ref('players').once('value').then(playersSnapshot => {
                    const allPlayers = playersSnapshot.val() || {};
                    const totalPlayers = Object.keys(allPlayers).length;
                    const disconnectedPlayers = totalPlayers - onlinePlayers;
                    document.getElementById('offlineCount').innerText = disconnectedPlayers;
                });
            });
        });

        function render() {
            const rankingEl = document.getElementById('ranking');
            const busqueda = document.getElementById('searchRanking').value.toLowerCase();
            // Ordenar por ELO
            let ordenados = [...players].sort((a, b) => b.elo - a.elo);
            // Filtrar
            let filtrados = ordenados.filter(p => p.name.toLowerCase().includes(busqueda));
            // Paginación
            const start = (currentPage - 1) * PAGE_SIZE;
            const visibles = filtrados.slice(start, start + PAGE_SIZE);
            rankingEl.innerHTML = visibles.map((p) => {
                const r = getRank(p.elo);
                const pos = ordenados.findIndex(x => x.name === p.name) + 1;
                const rachaClass = p.streak > 0 ? 'color:#4caf50' : 'color:#ff5252';
                const rachaIcon = p.streak > 0 ? '🔥' : (p.streak < 0 ? '💀' : '');

                return `<tr data-position="${pos}">  <!-- ← ESTA ES LA LÍNEA QUE FALTABA -->
                    <td style="font-weight:bold; color:#aaa;">${pos}</td>
                    <td style="padding-right: 4px !important; text-align: right;">${getBanderaHTML(p.country)}</td>
                    <td style="padding-left: 4px !important; text-align: left;">
                        <span class="player-link" onclick="openModal('${p.name}')">
                            <span class="player-name-text">${p.name}</span>
                            <span id="status-${p.name.replace(/[^a-zA-Z0-9]/g, '_')}" class="status-dot"></span>
                        </span>
                    </td>
                    <td class="${r.class}">${r.name}</td>
                    <td style="font-weight:bold;">${Math.round(p.elo)}</td>
                    <td><div class="progress"><div class="progress-fill" style="width:${getProgress(p.elo, r)}%"></div></div></td>
                    <td>${p.wins}/${p.losses}</td>
                    <td style="${rachaClass}; font-weight:bold;">${rachaIcon} ${Math.abs(p.streak || 0)}</td>
                </tr>`;
            }).join("");
            renderPagination(filtrados.length);

            // ← ESTA ES LA LÍNEA QUE DEBES AGREGAR AQUÍ
            updateOnlineStatus();
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / PAGE_SIZE);
            const container = document.getElementById('pagination');
            container.innerHTML = "";
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                if (i === currentPage) btn.className = "active";
                btn.onclick = () => { currentPage = i; render(); };
                container.appendChild(btn);
            }
        }

        // --- LÓGICA DE SESIÓN ---
        function verificarSesion() {
            const nombre = localStorage.getItem("logged_user");
            const userBar = document.getElementById("user-bar");
            const loginPrompt = document.getElementById("login-prompt");
            const nameDisplay = document.getElementById("current-user-name");

            if (nombre) {
                userBar.style.display = "flex";
                loginPrompt.style.display = "none";
                nameDisplay.innerText = nombre;

                // Marca online SOLO una vez por sesión
                if (!alreadyMarkedOnline[nombre]) {
                    alreadyMarkedOnline[nombre] = true;

                    const statusRef = db.ref('status/' + nombre);

                    statusRef.set({
                        online: true,
                        lastActive: firebase.database.ServerValue.TIMESTAMP,
                        device: navigator.userAgent
                    }).then(() => {
                        console.log(nombre + " marcado como ONLINE (solo una vez)");
                    }).catch(err => console.error("Error al marcar online:", err));

                    statusRef.onDisconnect().set({
                        online: false,
                        lastActive: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        console.log("onDisconnect configurado para " + nombre);
                    }).catch(err => console.error("Error en onDisconnect:", err));
                }
            } else {
                userBar.style.display = "none";
                loginPrompt.style.display = "block";
            }
        }
        function cerrarSesion() {
            if (confirm("¿Cerrar sesión de guerrero?")) {
                localStorage.removeItem("logged_user");
                location.reload();
            }
        }

        // Función para actualizar los puntos online/offline cada vez que se renderiza la tabla
        function updateOnlineStatus() {
            db.ref('status').once('value', snapshot => {
                const statusData = snapshot.val() || {};

                document.querySelectorAll('[id^="status-"]').forEach(span => {
                    const rawId = span.id.replace('status-', '');
                    const playerName = rawId.replace(/_/g, '-');

                    const userStatus = statusData[playerName];
                    span.className = '';
                    span.innerHTML = '';

                    if (userStatus && userStatus.online === true) {
                        span.classList.add('status-online');
                    } else {
                        span.innerHTML = '⚪';
                        span.style.color = '#9E9E9E';
                        span.style.fontSize = '1.1em';
                    }
                });
            });
        }

        // --- MODAL Y GRÁFICO ---

        function openModal(name) {
            const p = players.find(x => x.name === name);
            if (!p) return;

            // Título del modal
            document.getElementById('modalTitle').innerHTML = `${getBanderaHTML(p.country)} ${p.name}`;

            // Estadísticas básicas
            document.getElementById('modalStats').innerHTML = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align:left;">
                    <div><b>Rango:</b> <span class="${getRank(p.elo).class}">${getRank(p.elo).name}</span></div>
                    <div><b>ELO:</b> ${Math.round(p.elo)}</div>
                    <div><b>Victorias:</b> ${p.wins}</div>
                    <div><b>Derrotas:</b> ${p.losses}</div>
                </div>
                <button onclick="window.location.href='perfil.html?player=${encodeURIComponent(name)}'"
                        style="width:100%; margin-top:15px; padding:8px; background:#FFD700; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">
                        VER PERFIL COMPLETO
                </button>
            `;

            // Últimas 5 peleas (sin invertir, ya que history está ordenada descendente)
            const ultimasPeleas = history.filter(h => h.p1 === name || h.p2 === name).slice(0, 5);
            document.getElementById('modalHistory').innerHTML = ultimasPeleas.map(h => {
                const gano = (h.p1 === name && h.s1 > h.s2) || (h.p2 === name && h.s2 > h.s1);
                return `<li style="padding:5px 0; border-bottom:1px solid #333; font-size:0.85rem;">
                    <span style="color:${gano ? '#4caf50' : '#ff5252'}">${gano ? 'WIN' : 'LOSS'}</span> | 
                    ${h.p1} ${h.s1} - ${h.s2} ${h.p2}
                </li>`;
            }).join("");

            // Mostrar el modal (quita hidden)
            document.getElementById('modal').classList.remove("hidden");

            // Opcional: si querés cargar un gráfico simple aquí (puede ser pesado, así que lo dejamos comentado por ahora)
            // renderMiniChart(name); // si tenés una función para gráfico pequeño
        }

        function closeModal() { document.getElementById('modal').classList.add("hidden"); }

        document.getElementById('searchRanking').addEventListener('input', () => {
            currentPage = 1;
            render();
        });
    </script>
</body>

</html>
